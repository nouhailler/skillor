services:
  api:
    build: ./backend
    env_file: .env
    volumes:
      - ./backend:/app
      - ./data:/data
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"

  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./dist:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - api
